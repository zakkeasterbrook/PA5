name: Reproduce PA5 research

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full 524,288-entry benchmark instead of the quick benchmark'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install the pinned dependency
        run: python -m pip install -r requirements.txt
      - name: Verify integrity and reproduce quick experiments
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full }}
        run: python reproduce.py
      - name: Verify integrity and reproduce full experiments
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python reproduce.py --full
