<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">PA5 progressive key-value retrieval</title>
<desc id="desc">A scaled query starts with block summaries, advances to exact keys, then exact keys and values as necessary, with a decision margin check and dense fallback.</desc>
<rect width="1000" height="350" rx="20" fill="#101b2b"/>
<path d="M0 0H1000" stroke="#5eead4" stroke-width="7"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="40" y="49" font-size="16" font-weight="700" letter-spacing="3" fill="#5eead4">PA5  /  RESEARCH PROTOTYPE</text>
<text x="40" y="86" font-size="31" font-weight="700" fill="#f8fafc">Read only what the decision requires.</text>
<text x="40" y="116" font-size="17" fill="#b8c8da">Query-dependent bounds · Progressive retrieval · Dense fallback</text>
<g stroke="#3b526c" stroke-width="1.5" fill="#1b2a3e">
<rect x="40" y="145" width="272" height="102" rx="12"/><rect x="364" y="145" width="272" height="102" rx="12"/><rect x="688" y="145" width="272" height="102" rx="12"/>
</g>
<g fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.3"><text x="56" y="168">01 / SUMMARY</text><text x="380" y="168">02 / KEY REFINEMENT</text><text x="704" y="168">03 / FULL RETRIEVAL</text></g>
<g fill="#f1f5f9" font-size="21" font-weight="700"><text x="56" y="198">No original KV read</text><text x="380" y="198">Read exact keys</text><text x="704" y="198">Read keys + values</text></g>
<g fill="#b8c8da" font-size="15"><text x="56" y="224">Centroids + error bounds</text><text x="380" y="224">Values remain summarized</text><text x="704" y="224">Direct block calculation</text></g>
<g fill="none" stroke="#5eead4" stroke-width="2"><path d="M319 195H355m-7 -6l7 6-7 6"/><path d="M643 195H679m-7 -6l7 6-7 6"/></g>
<rect x="40" y="268" width="920" height="49" rx="10" fill="#153d41"/>
<text x="56" y="298" font-size="17" font-weight="700" fill="#b0fff0">At every stage: accept a sufficiently separated winner; otherwise refine or fall back.</text>
<text x="40" y="337" font-size="12" fill="#a4b5c8">Scope: single attention operation, bias-free linear readout. Real-arithmetic theorem; numerical prototype.</text>
</g></svg>