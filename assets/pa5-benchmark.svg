<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 522" role="img" aria-labelledby="title desc">
<title id="title">PA5 synthetic benchmark, 524,288 entries</title><desc id="desc">Logical cache reads and CPU speed ratios for six geometries. Identical keys, concentrated attention and key outlier are faster; clustered, random and tied data are slower.</desc>
<rect width="950" height="522" rx="18" fill="#101b2b"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="28" y="39" font-size="26" font-weight="700" fill="#f1f5f9">Where PA5 wins — and where it loses</text><text x="28" y="69" font-size="16" fill="#b8c8da">524,288 synthetic entries · 4 fixtures per geometry · CPU / NumPy</text>
<text x="28" y="112" font-size="14" font-weight="700" fill="#a4b5c8">GEOMETRY</text><text x="210" y="112" font-size="14" font-weight="700" fill="#a4b5c8">LOGICAL READS (% OF DENSE)</text><text x="910" y="112" font-size="14" text-anchor="end" font-weight="700" fill="#a4b5c8">CPU SPEED RATIO</text>
<text x="547.5" y="138" font-size="13" text-anchor="middle" fill="#b8c8da">100% baseline</text>
<text x="28" y="168" font-size="18" font-weight="600" fill="#e5edf5">Identical keys</text><rect x="210" y="151" width="540" height="24" rx="5" fill="#26374c"/><rect x="210" y="151" width="2.719116" height="24" rx="5" fill="#53c5b6"/><text x="275" y="169" font-size="15" font-weight="700" text-anchor="start" fill="#e5edf5">0.8%</text><text x="910" y="169" font-size="19" text-anchor="end" font-weight="700" fill="#83e4cf">16.47×</text>
<text x="28" y="219" font-size="18" font-weight="600" fill="#e5edf5">Concentrated</text><rect x="210" y="202" width="540" height="24" rx="5" fill="#26374c"/><rect x="210" y="202" width="18.5394285" height="24" rx="5" fill="#53c5b6"/><text x="275" y="220" font-size="15" font-weight="700" text-anchor="start" fill="#e5edf5">5.5%</text><text x="910" y="220" font-size="19" text-anchor="end" font-weight="700" fill="#83e4cf">4.92×</text>
<text x="28" y="270" font-size="18" font-weight="600" fill="#e5edf5">Key outlier</text><rect x="210" y="253" width="540" height="24" rx="5" fill="#26374c"/><rect x="210" y="253" width="34.359741" height="24" rx="5" fill="#53c5b6"/><text x="275" y="271" font-size="15" font-weight="700" text-anchor="start" fill="#e5edf5">10.2%</text><text x="910" y="271" font-size="19" text-anchor="end" font-weight="700" fill="#83e4cf">2.55×</text>
<text x="28" y="321" font-size="18" font-weight="600" fill="#e5edf5">Clustered</text><rect x="210" y="304" width="540" height="24" rx="5" fill="#26374c"/><rect x="210" y="304" width="213.65661599999999" height="24" rx="5" fill="#53c5b6"/><text x="431.656616" y="322" font-size="15" font-weight="700" text-anchor="start" fill="#e5edf5">63.3%</text><text x="910" y="322" font-size="19" text-anchor="end" font-weight="700" fill="#f1b87c">0.59×</text>
<text x="28" y="372" font-size="18" font-weight="600" fill="#e5edf5">Random</text><rect x="210" y="355" width="540" height="24" rx="5" fill="#26374c"/><rect x="210" y="355" width="498.42224100000004" height="24" rx="5" fill="#e5a45c"/><text x="745" y="373" font-size="15" font-weight="700" text-anchor="end" fill="#f4f6f9">147.7%</text><text x="910" y="373" font-size="19" text-anchor="end" font-weight="700" fill="#f1b87c">0.35×</text>
<text x="28" y="423" font-size="18" font-weight="600" fill="#e5edf5">Tied</text><rect x="210" y="406" width="540" height="24" rx="5" fill="#26374c"/><rect x="210" y="406" width="498.42224100000004" height="24" rx="5" fill="#e5a45c"/><text x="745" y="424" font-size="15" font-weight="700" text-anchor="end" fill="#f4f6f9">147.7%</text><text x="910" y="424" font-size="19" text-anchor="end" font-weight="700" fill="#f1b87c">0.33×</text>
<path d="M547.5 144V432" stroke="#d4dfeb" stroke-dasharray="4 5" stroke-width="1.5"/>
<path d="M28 461H922" stroke="#3b526c"/>
<text x="28" y="484" font-size="14" fill="#b8c8da">Read fractions: lower is better. Speed: higher is better. Values &lt; 1× are slower than dense.</text>
<text x="28" y="507" font-size="13" fill="#a4b5c8">Logical access estimates, not measured DRAM traffic. CPU timings exclude summary construction.</text></g></svg>